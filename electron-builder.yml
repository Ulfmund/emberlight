appId: app.emberlight.rp
productName: Emberlight
directories:
  buildResources: resources
  output: release
files:
  - out/**
  - package.json
asarUnpack:
  - resources/**
# Where the installed app looks for updates (public GitHub Releases).
# The release workflow uploads the installer plus latest.yml and the .blockmap that the updater reads.
publish:
  provider: github
  owner: Ulfmund
  repo: emberlight
  releaseType: release
win:
  icon: resources/icon.ico
  target:
    - nsis
nsis:
  # A normal "Next, Next, Install" wizard rather than a silent one-click install.
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Emberlight
  artifactName: Emberlight-Setup-${version}.${ext}
  # Keep saved settings and campaigns if the app is uninstalled or updated.
  deleteAppDataOnUninstall: false

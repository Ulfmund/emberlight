appId: app.emberlight.rp
productName: Emberlight
directories:
  buildResources: resources
  output: release
files:
  - out/**
  - package.json
asarUnpack:
  - resources/**
# Where the installed app looks for updates: the files on the newest public GitHub Release.
# GitHub redirects /releases/latest/download/<file> to that release's copy of <file>, so the app
# reads latest.yml and downloads the installer with no page scraping or API rate limits.
# The release workflow uploads the installer plus latest.yml and the .blockmap.
publish:
  provider: generic
  url: https://github.com/Ulfmund/emberlight/releases/latest/download
win:
  icon: resources/icon.ico
  target:
    - nsis
nsis:
  # A normal "Next, Next, Install" wizard rather than a silent one-click install.
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Emberlight
  artifactName: Emberlight-Setup-${version}.${ext}
  # Keep saved settings and campaigns if the app is uninstalled or updated.
  deleteAppDataOnUninstall: false

# Builds the Windows installer and attaches it to a GitHub Release.
#
# No command line needed: on GitHub, go to Releases → "Draft a new release", type a new tag
# such as v0.0.2, and click Publish. A few minutes later the installer appears on that release.
name: Build installer

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build for (e.g. v0.0.1)'
        required: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set the app version from the release tag
        shell: bash
        run: npm version "${TAG#v}" --no-git-tag-version --allow-same-version

      - name: Type-check
        run: npm run typecheck

      # Electron and the installer tools are downloaded from GitHub release files, which sometimes
      # time out (HTTP 504). Keep them between runs so they only need downloading once.
      - name: Cache Electron downloads
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-dl-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-dl-${{ runner.os }}-

      - name: Build installer (retries on download timeouts)
        shell: bash
        run: |
          for attempt in 1 2 3 4; do
            if npm run package; then exit 0; fi
            echo "Build attempt $attempt failed; retrying in 30s..."
            sleep 30
          done
          exit 1

      # latest.yml and the .blockmap are what installed copies read to find and download updates.
      - name: Attach installer and update files to the release
        shell: bash
        run: gh release upload "$TAG" release/Emberlight-Setup-*.exe release/Emberlight-Setup-*.exe.blockmap release/latest.yml --clobber
